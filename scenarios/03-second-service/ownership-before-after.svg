<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" width="1200" height="580" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
  <!-- Ownership before and after the Tenant / ServiceClaim split (ADR-010).
       Solid arrows are controller owner references, dashed arrows are name
       references, thin grey lines are reconcile order only. -->
  <rect width="1200" height="580" fill="#ffffff"/>

  <defs>
    <marker id="own" viewBox="0 0 10 10" refX="9.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M 0.5 0.5 L 9.5 5 L 0.5 9.5 z" fill="#ffffff" stroke="#333333" stroke-width="1.1"/>
    </marker>
    <marker id="ref" viewBox="0 0 10 10" refX="9.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M 0.5 0.5 L 9.5 5 L 0.5 9.5 z" fill="#ffffff" stroke="#666666" stroke-width="1.1"/>
    </marker>
    <marker id="bad" viewBox="0 0 10 10" refX="9.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M 0.5 0.5 L 9.5 5 L 0.5 9.5 z" fill="#ffffff" stroke="#b85450" stroke-width="1.3"/>
    </marker>
  </defs>

  <!-- ================= BEFORE (M3) ================= -->
  <rect x="30" y="30" width="560" height="450" fill="#eeeeee" stroke="#a6a6a6" stroke-width="1.2"/>
  <rect x="30" y="30" width="390" height="28" fill="#4a90d9" stroke="#3a78b8" stroke-width="1"/>
  <text x="42" y="49" font-size="14.5" font-weight="700" fill="#ffffff">Before (M3): one ServiceClaim owns everything</text>
  <text x="50" y="82" font-size="13" fill="#666666">Three of the four objects are team-level, not service-level</text>

  <!-- claim A -->
  <rect x="90" y="98" width="200" height="54" fill="#d5e8d4" stroke="#82b366" stroke-width="1.4"/>
  <text x="190" y="121" font-size="15" font-weight="700" fill="#2d5a27" text-anchor="middle">ServiceClaim</text>
  <text x="190" y="141" font-size="13" fill="#2d5a27" text-anchor="middle">payments</text>

  <!-- owned objects -->
  <rect x="90" y="196" width="200" height="46" fill="#fff2cc" stroke="#d6b656" stroke-width="1.4"/>
  <text x="190" y="216" font-size="14" font-weight="700" fill="#333333" text-anchor="middle">Namespace</text>
  <text x="190" y="234" font-size="12.5" fill="#555555" text-anchor="middle">team-payments</text>

  <rect x="90" y="264" width="200" height="46" fill="#fff2cc" stroke="#d6b656" stroke-width="1.4"/>
  <text x="190" y="284" font-size="14" font-weight="700" fill="#333333" text-anchor="middle">RoleBinding</text>
  <text x="190" y="302" font-size="12.5" fill="#555555" text-anchor="middle">team-edit</text>

  <rect x="90" y="332" width="200" height="46" fill="#fff2cc" stroke="#d6b656" stroke-width="1.4"/>
  <text x="190" y="352" font-size="14" font-weight="700" fill="#333333" text-anchor="middle">ResourceQuota</text>
  <text x="190" y="370" font-size="12.5" fill="#555555" text-anchor="middle">team-quota</text>

  <rect x="90" y="400" width="200" height="46" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.4"/>
  <text x="190" y="420" font-size="14" font-weight="700" fill="#1f3f73" text-anchor="middle">Application</text>
  <text x="190" y="438" font-size="12.5" fill="#1f3f73" text-anchor="middle">payments</text>

  <!-- reconcile order (thin, no arrowhead) -->
  <g stroke="#b3b3b3" stroke-width="1" fill="none">
    <path d="M 190 242 L 190 264"/>
    <path d="M 190 310 L 190 332"/>
    <path d="M 190 378 L 190 400"/>
  </g>

  <!-- owner bus from claim A to all four -->
  <g stroke="#333333" stroke-width="1.3" fill="none">
    <path d="M 90 125 L 62 125 L 62 423"/>
    <path d="M 62 219 L 90 219" marker-end="url(#own)"/>
    <path d="M 62 287 L 90 287" marker-end="url(#own)"/>
    <path d="M 62 355 L 90 355" marker-end="url(#own)"/>
    <path d="M 62 423 L 90 423" marker-end="url(#own)"/>
  </g>
  <text x="104" y="180" font-size="13" font-weight="700" fill="#9933ff">owns all four</text>

  <!-- claim B -->
  <rect x="350" y="98" width="200" height="54" fill="#f8cecc" stroke="#b85450" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="450" y="121" font-size="15" font-weight="700" fill="#7a2622" text-anchor="middle">ServiceClaim</text>
  <text x="450" y="141" font-size="13" fill="#7a2622" text-anchor="middle">payments-api</text>

  <!-- blocked ownership attempt -->
  <path d="M 450 152 L 450 219 L 290 219" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#bad)"/>
  <g stroke="#b85450" stroke-width="2.4" stroke-linecap="round">
    <path d="M 316 211 L 332 227"/>
    <path d="M 332 211 L 316 227"/>
  </g>
  <text x="462" y="180" font-size="13" font-weight="700" fill="#b85450">wants to own</text>
  <text x="462" y="197" font-size="13" font-weight="700" fill="#b85450">the same three</text>

  <rect x="320" y="270" width="250" height="88" fill="#f8cecc" stroke="#b85450" stroke-width="1.4"/>
  <text x="445" y="296" font-size="15" font-weight="700" fill="#7a2622" text-anchor="middle">AlreadyOwnedError</text>
  <text x="445" y="319" font-size="12.5" fill="#7a2622" text-anchor="middle">one controller owner per object</text>
  <text x="445" y="340" font-size="12.5" fill="#7a2622" text-anchor="middle">second claim never goes Ready</text>

  <!-- ================= AFTER (M4) ================= -->
  <rect x="610" y="30" width="560" height="450" fill="#eeeeee" stroke="#a6a6a6" stroke-width="1.2"/>
  <rect x="610" y="30" width="410" height="28" fill="#a064d8" stroke="#8a4fc0" stroke-width="1"/>
  <text x="622" y="49" font-size="14.5" font-weight="700" fill="#ffffff">After (M4): split along the team / service seam</text>
  <text x="630" y="82" font-size="13" fill="#666666">One Tenant per team, many ServiceClaims per Tenant</text>

  <!-- tenant -->
  <rect x="670" y="98" width="190" height="54" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.4"/>
  <text x="765" y="121" font-size="15" font-weight="700" fill="#4b2e5c" text-anchor="middle">Tenant</text>
  <text x="765" y="141" font-size="13" fill="#4b2e5c" text-anchor="middle">payments</text>

  <rect x="670" y="196" width="190" height="46" fill="#fff2cc" stroke="#d6b656" stroke-width="1.4"/>
  <text x="765" y="216" font-size="14" font-weight="700" fill="#333333" text-anchor="middle">Namespace</text>
  <text x="765" y="234" font-size="12.5" fill="#555555" text-anchor="middle">team-payments</text>

  <rect x="670" y="264" width="190" height="46" fill="#fff2cc" stroke="#d6b656" stroke-width="1.4"/>
  <text x="765" y="284" font-size="14" font-weight="700" fill="#333333" text-anchor="middle">RoleBinding</text>
  <text x="765" y="302" font-size="12.5" fill="#555555" text-anchor="middle">team-edit</text>

  <rect x="670" y="332" width="190" height="46" fill="#fff2cc" stroke="#d6b656" stroke-width="1.4"/>
  <text x="765" y="352" font-size="14" font-weight="700" fill="#333333" text-anchor="middle">ResourceQuota</text>
  <text x="765" y="370" font-size="12.5" fill="#555555" text-anchor="middle">team-quota</text>

  <g stroke="#b3b3b3" stroke-width="1" fill="none">
    <path d="M 765 242 L 765 264"/>
    <path d="M 765 310 L 765 332"/>
  </g>

  <g stroke="#333333" stroke-width="1.3" fill="none">
    <path d="M 670 125 L 642 125 L 642 355"/>
    <path d="M 642 219 L 670 219" marker-end="url(#own)"/>
    <path d="M 642 287 L 670 287" marker-end="url(#own)"/>
    <path d="M 642 355 L 670 355" marker-end="url(#own)"/>
  </g>
  <text x="684" y="180" font-size="13" font-weight="700" fill="#9933ff">owns the team</text>

  <!-- claims -->
  <rect x="950" y="98" width="200" height="54" fill="#d5e8d4" stroke="#82b366" stroke-width="1.4"/>
  <text x="1050" y="121" font-size="15" font-weight="700" fill="#2d5a27" text-anchor="middle">ServiceClaim</text>
  <text x="1050" y="141" font-size="13" fill="#2d5a27" text-anchor="middle">payments</text>

  <rect x="950" y="196" width="200" height="46" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.4"/>
  <text x="1050" y="216" font-size="14" font-weight="700" fill="#1f3f73" text-anchor="middle">Application</text>
  <text x="1050" y="234" font-size="12.5" fill="#1f3f73" text-anchor="middle">payments</text>

  <rect x="950" y="300" width="200" height="54" fill="#d5e8d4" stroke="#82b366" stroke-width="1.4"/>
  <text x="1050" y="323" font-size="15" font-weight="700" fill="#2d5a27" text-anchor="middle">ServiceClaim</text>
  <text x="1050" y="343" font-size="13" fill="#2d5a27" text-anchor="middle">payments-api</text>

  <rect x="950" y="398" width="200" height="46" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.4"/>
  <text x="1050" y="418" font-size="14" font-weight="700" fill="#1f3f73" text-anchor="middle">Application</text>
  <text x="1050" y="436" font-size="12.5" fill="#1f3f73" text-anchor="middle">payments-api</text>

  <g stroke="#333333" stroke-width="1.3" fill="none">
    <path d="M 1050 152 L 1050 196" marker-end="url(#own)"/>
    <path d="M 1050 354 L 1050 398" marker-end="url(#own)"/>
  </g>
  <text x="1060" y="179" font-size="12.5" font-weight="700" fill="#9933ff">owns its own</text>
  <text x="1060" y="381" font-size="12.5" font-weight="700" fill="#9933ff">owns its own</text>

  <!-- name references to the Tenant -->
  <g stroke="#666666" stroke-width="1.3" stroke-dasharray="6 4" fill="none">
    <path d="M 950 118 L 860 118" marker-end="url(#ref)"/>
    <path d="M 950 327 L 905 327 L 905 138 L 860 138" marker-end="url(#ref)"/>
  </g>
  <text x="872" y="108" font-size="12.5" font-weight="700" fill="#9933ff">spec.team</text>
  <text x="913" y="250" font-size="12.5" font-weight="700" fill="#9933ff">spec.team</text>

  <!-- ================= LEGEND ================= -->
  <g font-size="13" fill="#444444">
    <path d="M 40 516 L 84 516" stroke="#333333" stroke-width="1.3" fill="none" marker-end="url(#own)"/>
    <text x="94" y="521">controller owner reference</text>

    <path d="M 330 516 L 374 516" stroke="#666666" stroke-width="1.3" stroke-dasharray="6 4" fill="none" marker-end="url(#ref)"/>
    <text x="384" y="521">name reference, no ownership</text>

    <path d="M 640 516 L 684 516" stroke="#b3b3b3" stroke-width="1" fill="none"/>
    <text x="694" y="521">reconcile order</text>

    <path d="M 850 516 L 894 516" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#bad)"/>
    <text x="904" y="521">ownership refused</text>
  </g>
  <text x="40" y="556" font-size="12.5" fill="#888888">idp-platform-lab, ADR-010. Run the before-state: github.com/ChenYuTingJerry/idp-platform-lab/tree/main/scenarios/03-second-service</text>
</svg>
